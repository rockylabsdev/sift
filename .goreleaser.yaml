# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release config. Runs from .github/workflows/release.yml on a v* tag,
# after CI passes. Check locally with
#   go run github.com/goreleaser/goreleaser/v2@latest check
#   go run github.com/goreleaser/goreleaser/v2@latest release --snapshot --clean
version: 2
project_name: sift

builds:
  - id: sift
    main: ./cmd/sift
    binary: sift
    env:
      # No cgo: the Keychain is reached through /usr/bin/security and flock
      # through syscall, so one static binary per target.
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/rockylabsdev/sift/internal/cli.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, docs/evidence.md]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude: ["^Release v"]

release:
  github:
    owner: rockylabsdev
    name: sift
  # A vX.Y.Z-rc.N tag is a pre-release for testers: not shown as latest,
  # and never pushed to the tap.
  prerelease: auto

# A formula, not a cask: Homebrew quarantines cask downloads but not formula
# installs, and the binary is unsigned (as in punchcard's ADR 0007).
brews:
  - name: sift
    repository:
      owner: rockylabsdev
      name: homebrew-tap # brew install rockylabsdev/tap/sift
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/rockylabsdev/sift"
    description: "A terminal worklog drafter: your work, accounted for"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    skip_upload: auto
    install: |
      bin.install "sift"
    test: |
      system "#{bin}/sift", "version"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs this as its gate

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: sift version --json
        run: go run ./cmd/sift version --json
